<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thank You — Code with ABM</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --navy:   #0B1628;
      --navy2:  #112240;
      --gold:   #C9A84C;
      --gold2:  #E8C87A;
      --cream:  #F5F0E8;
      --white:  #FFFFFF;
      --gray:   #8892A4;
      --light:  #EDF2F4;
      --accent: #1E3A5F;
    }

    body {
      margin: 0;
      font-family: 'DM Sans', sans-serif;
      background: var(--navy);
      color: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    .thank-container {
      background: var(--navy2);
      padding: 3rem 2rem;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      max-width: 600px;
      width: 90%;
      animation: fadeIn 1s ease-out;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      color: var(--gold);
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: var(--light);
      margin-bottom: 2rem;
    }

    a {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: var(--gold);
      color: var(--navy);
      font-weight: 600;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.3s ease;
    }

    a:hover {
      background: var(--gold2);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="thank-container">
    <h1>Thank You!</h1>
    <p>Your enquiry has been sent successfully.<br/>
       We’ll review your project details and get back to you shortly.</p>
    <a href="index.html">← Back to Home</a>
  </div>
</body>
</html>
